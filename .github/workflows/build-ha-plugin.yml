name: Build Home Assistant Plugin
on:
  workflow_dispatch:
  push:
    branches: [continuous-native-conversation]
    paths:
      - 'home-assistant-plugin/**'
      - '.github/workflows/build-ha-plugin.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate plugin JavaScript and manifest
        run: |
          node --check home-assistant-plugin/src/plugin/index.js
          node home-assistant-plugin/tests/test_plugin.cjs
      - name: Package Pebble plugin-only PBW
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/coredevices/pebble-apps/ff7f6c5bd5c1aafce3cf8626aa143eb5599130f2/scripts/pack-plugin-pbw.py \
            --output /tmp/pack-plugin-pbw.py
          python3 /tmp/pack-plugin-pbw.py home-assistant-plugin
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('home-assistant-plugin/build/pebble-home-assistant-plugin.pbw') as z:
              info=json.loads(z.read('appinfo.json'))
              assert info['manifestVersion']==2
              assert info['plugin']['script'] in z.namelist()
              assert info['configPage'] in z.namelist()
              print('Packaged plugin',info['uuid'],info['versionLabel'])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: home-assistant-plugin-${{ github.sha }}
          path: home-assistant-plugin/build/*.pbw
          if-no-files-found: error
          retention-days: 30
