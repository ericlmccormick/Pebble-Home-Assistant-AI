name: Static regression checks
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax (app and shared audio SDK)
        run: |
          node --check src/pkjs/index.js
          node --check src/pkjs/ha_audio.js
      - name: Plugin-only architecture and Pebble message contract
        run: node tests/audio-flow.test.cjs
      - name: Progressive WAV playback and integrity tests
        run: node tests/progressive-audio.test.cjs
      - name: Sentence prefetch, ordered chunks and Bluetooth continuity
        run: node tests/sentence-prefetch.test.cjs
      - name: Static watch SDK interface validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c=Path('src/c/main.c').read_text()
          watch=Path('src/c/ha_audio.c').read_text()
          header=Path('src/c/ha_audio.h').read_text()
          phone=Path('src/pkjs/index.js').read_text()
          assert '#include "ha_audio.h"' in c
          assert 'ha_audio_handle_message(iterator)' in c
          assert 'ha_audio_handle_message' in watch and 'ha_audio_handle_message' in header
          assert 'AUDIO_RESET' in watch and 'AUDIO_CHUNK' in watch
          assert 'AUDIO_SENTENCE_END' in watch and 'AUDIO_STOP' in watch
          assert 's_pcm_frames[2][PLAYBACK_PCM_SAMPLES]' in watch
          assert 'mic_stream_to_phone' not in c
          assert 'new WebSocket' not in phone and '/api/conversation/process' not in phone
          assert 'USE_BUILTIN_CONNECTION' not in phone
          print('Bridge-only native audio and message contract passed')
          PY
