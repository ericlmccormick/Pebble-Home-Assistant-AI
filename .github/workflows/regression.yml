name: Static regression checks
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check src/pkjs/index.js
      - name: WAV decoder regression tests
        run: node tests/test_wav_parser.js
      - name: Assist conversation WebSocket regression tests
        run: node tests/test_conversation.js
      - name: Home Assistant plugin provider regression tests
        run: node tests/test_plugin_provider.js
      - name: Legacy SDK dictation conversation tests
        run: node tests/test_legacy_conversation.js
      - name: Home Assistant dropdown discovery tests
        run: node tests/test_settings_discovery.js
      - name: Release settings and retry regression tests
        run: node tests/test_release_features.js
      - name: Home Assistant API and Pebble message contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkg = json.loads(Path('package.json').read_text())
          c = Path('src/c/main.c').read_text()
          js = Path('src/pkjs/index.js').read_text()
          keys = set(pkg['pebble']['messageKeys'])
          assert {'COMMAND','TEXT','CHUNK','FONT_SIZE','VOLUME'} <= keys
          for cmd in ('DICTATION','TEXT_RESPONSE_NO_AUDIO','TEXT_RESPONSE_8_16',
                      'AUDIO_CHUNK','AUDIO_SENTENCE_END'):
              assert (cmd in c or (cmd == 'TEXT_RESPONSE_8_16' and 'strncmp(command_tuple->value->cstring, "TEXT_RESPONSE", 13)' in c))
              assert cmd in js
          assert '/api/conversation/process' in js
          assert '/api/tts_get_url' in js
          assert 'preferred_format' in js and "preferred_sample_rate:8000" in js
          assert 's_gemini_text' not in c
          assert 'RESOURCE_ID_IMAGE_GEMINI_LOGO' not in c
          assert 'generativelanguage.googleapis.com' not in js
          assert 'texttospeech.googleapis.com' not in js
          assert pkg['pebble']['displayName'] == 'Home Assistant AI'
          assert 'select_long_click_handler' in c
          assert 'conversation_toggle();' in c
          assert 'CONV_DICTATION' in c and 'CONV_DICTATION' in js
          assert 'conversation_resume_callback' in c
          assert 'DictationSessionStatusFailureTranscriptionRejectedWithError' in c
          assert 'dictation_session_stop(s_dictation_session)' in c
          assert 'Conversation: dictation' in c
          assert 'Conversation\\nDictation mode' in c
          # Final TTS audio packets can be smaller than one speaker frame;
          # they must be consumed or the buffer never empties to resume listening.
          assert 'const uint16_t bytes_to_decode = s_buffer_count < PLAYBACK_ADPCM_BYTES' in c
          assert 'i < bytes_to_decode' in c
          assert 'if (s_buffer_count == 0) schedule_close_timer();' in c
          assert 's_buffer_count >= PLAYBACK_ADPCM_BYTES' not in c
          assert 'native_mic_stop();' in c
          assert 'if (s_conversation_mode && !s_dictation_fallback)' in c
          assert 'if (!s_native_waiting && s_native_streaming)' in c
          assert 'mic_stream_to_phone_start' in c
          assert 's_native_phone_accepted' in c
          for stop_reason in ('MicStreamStopReasonPhone','MicStreamStopReasonFocusLost',
                              'MicStreamStopReasonInterrupted','MicStreamStopReasonError'):
              assert stop_reason in c
          assert 'Phone refused mic; check permission' in c
          assert 'window_single_click_subscribe(BUTTON_ID_BACK, results_back_click_handler)' in c
          assert 'set_ui_state(UI_STATE_IDLE);' in c
          assert 'window_single_click_subscribe(BUTTON_ID_BACK, exit_back_click_handler)' in c
          assert c.count('window_single_click_subscribe(BUTTON_ID_BACK') == 2
          assert c.count('window_long_click_subscribe(BUTTON_ID_SELECT') == 2
          assert '"Home\\nAssistant AI"' in c
          assert '"Vol +"' in c and '"Vol -"' in c
          assert 'Hold: conversation' not in c
          assert 'Tap Select: talk' not in c
          assert 'GRect(65, 19, bounds.size.w - 67, 52)' in c
          assert 'GRect(bounds.size.w - 59, 23, 56, 24)' in c
          assert 'GRect(bounds.size.w - 59, bounds.size.h - 53, 56, 24)' in c
          assert 'RESOURCE_ID_IMAGE_HOME_ASSISTANT_LOGO' in c
          assert {'AUTO_SEND','HAPTIC_LEVEL'} <= keys
          for cmd in ('SETTINGS','HAPTIC_PREVIEW'):
              assert cmd in c and cmd in js
          assert 'dictation_session_enable_confirmation' in c
          assert 'dictation_session_enable_error_dialogs' in c
          assert 'You said:' in c
          assert "messageKey:'ENABLE_TTS'" in js
          assert "messageKey:'TEXT_ONLY'" not in js
          assert "messageKey:'AUTO_SEND'" in js
          assert "messageKey:'HAPTIC_LEVEL'" in js
          assert 'Home Assistant timed out' in js
          assert 'failureCount>=5' in js
          assert pkg['pebble']['manifestVersion'] == 2
          assert 'WatchMicrophone' in pkg['pebble']['usesPermissions']
          for cmd in ('MIC_MODE_ON','MIC_MODE_OFF','CONV_RESUME','CONV_AUDIO_END'):
              assert cmd in c and cmd in js
          print('Static regression checks passed')
          PY
